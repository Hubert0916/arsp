[project]
name = "asrp"
version = "0.1.0"
description = "Adaptive Support-Based Response Prediction for the AIMS competition"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
  "transformers>=5,<6",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "threadpoolctl>=3.5,<4",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
